<style>
  :root{--paper:#f3ead3;--land:#efe5cc;--ink:#2b2622;--ink2:#5b5148;--red:#c8402f;--card:#fbf6e8;--line:#d8cba8}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#141210}
  body{font-family:'Kalam','Comic Sans MS',cursive;color:var(--ink)}
  #stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:center;transform:translate(-50%,-50%);
    background:var(--paper);overflow:hidden;cursor:pointer;
    background-image:radial-gradient(circle at 20% 8%,rgba(255,255,255,.6),transparent 40%),radial-gradient(circle at 85% 92%,rgba(160,130,80,.14),transparent 45%),
      repeating-linear-gradient(0deg,rgba(120,100,60,.04) 0 2px,transparent 2px 46px)}
  .title{position:absolute;left:0;right:0;top:70px;text-align:center}
  .title h1{font-family:'Caveat',cursive;font-weight:700;font-size:84px;margin:0;line-height:1}
  .title p{margin:6px 0 0;font-family:'Caveat',cursive;font-size:46px;color:var(--red);font-weight:700}
  .mapcard{position:absolute;left:30px;top:250px;width:1020px;height:1000px;background:var(--land);border:4px solid var(--ink);
    border-radius:10px 16px 12px 18px;box-shadow:8px 9px 0 rgba(43,38,34,.2);overflow:hidden}
  .mapcard::after{content:"";position:absolute;inset:10px;border:2px solid rgba(43,38,34,.35);border-radius:6px 12px 8px 14px;pointer-events:none}
  #map{display:block;width:100%;height:100%}
  #map text{font-family:'Caveat',cursive;paint-order:stroke;stroke:var(--land);stroke-linejoin:round}
  .stamp{position:absolute;left:34px;top:18px;font-family:'Caveat',cursive;font-weight:700;font-size:170px;line-height:.9;color:var(--red);
    transform:rotate(-4deg);text-shadow:4px 4px 0 rgba(255,255,255,.7);pointer-events:none}
  .compass{position:absolute;right:26px;top:24px;width:96px;height:96px;pointer-events:none}
  .stats{position:absolute;right:22px;bottom:22px;display:flex;gap:10px;pointer-events:none}
  .stats div{background:var(--card);border:3px solid var(--ink);border-radius:12px 8px 14px 9px;padding:6px 14px;text-align:center;box-shadow:4px 4px 0 rgba(43,38,34,.18)}
  .stats b{display:block;font-family:'Caveat',cursive;font-size:58px;line-height:.95}
  .stats span{font-size:20px;color:var(--ink2);line-height:1}
  .cap{position:absolute;left:30px;top:1280px;width:920px;min-height:300px;background:var(--card);border:3px solid var(--ink);
    border-radius:14px 9px 16px 10px;padding:22px 30px;box-shadow:6px 6px 0 rgba(43,38,34,.16)}
  .cap .row{display:flex;align-items:baseline;gap:22px;flex-wrap:wrap}
  .cap .yr{font-family:'Caveat',cursive;font-weight:700;font-size:86px;color:var(--red);line-height:.9}
  .cap h2{font-family:'Caveat',cursive;font-size:60px;margin:0;line-height:1}
  .cap p{margin:12px 0 0;font-size:31px;line-height:1.35}
  .cap.anim{animation:pop .5s ease}
  @keyframes pop{from{opacity:0;transform:translateY(16px) rotate(-.6deg)}to{opacity:1;transform:none}}
  .timeline{position:absolute;left:60px;right:160px;top:1650px;height:40px}
  .track{position:absolute;left:0;right:0;top:14px;height:8px;background:var(--line);border-radius:4px}
  .fill{position:absolute;left:0;top:14px;height:8px;background:var(--red);border-radius:4px;width:0;transition:width .6s}
  .dot{position:absolute;top:7px;width:22px;height:22px;margin-left:-11px;border-radius:50%;border:3px solid var(--ink);background:var(--card)}
  .dot.done{background:var(--red)}
  .dot.cur{transform:scale(1.4);background:#ffe14d}
  .tick{position:absolute;top:40px;font-size:22px;color:var(--ink2);transform:translateX(-50%)}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:rgba(20,18,16,.55);color:#fbf6e8;font-family:'Caveat',cursive;z-index:10;cursor:pointer;text-align:center}
  #overlay b{font-size:64px}
  #overlay span{font-family:'Kalam',cursive;font-size:18px;opacity:.85;max-width:520px;line-height:1.5}
</style>
</head>

  const e = document.createElementNS(NS, tag);

};
const f2 = n => n.toFixed(2);
function smooth(pts, closed) {
  if (pts.length < 2) return '';
  let d = `M${f2(pts[0][0])},${f2(pts[0][1])}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    d += `C${f2(p1[0] + (p2[0] - p0[0]) / 6)},${f2(p1[1] + (p2[1] - p0[1]) / 6)} ${f2(p2[0] - (p3[0] - p1[0]) / 6)},${f2(p2[1] - (p3[1] - p1[1]) / 6)} ${f2(p2[0])},${f2(p2[1])}`;
  }
  return closed ? d + 'Z' : d;
}
function partial(pts, segs, total, t) {
  if (t >= 1) return pts;
  if (t <= 0) return [];
  let rest = total * t; const out = [pts[0]];
  for (let i = 0; i < segs.length; i++) {
    if (rest > segs[i]) { out.push(pts[i + 1]); rest -= segs[i]; }
    else { const f = rest / segs[i]; out.push([pts[i][0] + (pts[i + 1][0] - pts[i][0]) * f, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * f]); break; }
  }
  return out;
}

/* ---------------- Görünüm (zoom) ---------------- */
const FULL = [45, -150, 730, 716];
let view = FULL.slice();
function fit(b, pad = 0.45, minW = 120) {
  let w = (b[2] - b[0]), h = (b[3] - b[1]);
  const cx = (b[0] + b[2]) / 2, cy = (b[1] + b[3]) / 2;
  w = Math.max(w * (1 + pad * 2), minW); h = Math.max(h * (1 + pad * 2), minW / A);
  if (w / h > A) h = w / A; else w = h * A;
  if (w >= FULL[2]) return FULL.slice();
  return [Math.min(Math.max(cx - w / 2, -60), 860 - w), Math.min(Math.max(cy - h / 2, -380), 880 - h), w, h];
}
EVENTS.forEach(ev => {
  if (ev.full || !ev.items.length) { ev.view = FULL.slice(); return; }
  const b = [1e9, 1e9, -1e9, -1e9];
  for (const it of ev.items) for (const [x, y] of it.p) { b[0] = Math.min(b[0], x); b[1] = Math.min(b[1], y); b[2] = Math.max(b[2], x); b[3] = Math.max(b[3], y); }
  ev.view = fit(b);
});
const lerp = (a, b, t) => a + (b - a) * t;
const lerpV = (a, b, t) => a.map((v, i) => lerp(v, b[i], t));
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function unionV(a, b) {
  const r = [Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.max(a[0] + a[2], b[0] + b[2]), Math.max(a[1] + a[3], b[1] + b[3])];
  return fit(r, 0.05, 0);
}
const overlaps = (a, b) => a[0] < b[0] + b[2] && b[0] < a[0] + a[2] && a[1] < b[1] + b[3] && b[1] < a[1] + a[3];

/* ---------------- Çizim ---------------- */
const svg = document.getElementById('map'), hatch = document.getElementById('hatch');
let STROKED = null, lastK = -1;
function render() {
  const k = view[2] / W;
  svg.setAttribute('viewBox', view.map(f2).join(' '));
  hatch.setAttribute('patternTransform', `scale(${f2(k * 1.4)}) rotate(35)`);
  if (!STROKED) STROKED = [...svg.querySelectorAll('#base path[stroke], #roads path')].map(e => ({e, w: +e.getAttribute('stroke-width'), d: e.getAttribute('stroke-dasharray')}));
  if (Math.abs(k - lastK) > 1e-4) {
    lastK = k; const sk = k * S;
    for (const s of STROKED) {
      s.e.setAttribute('stroke-width', (s.w * sk).toFixed(3));
      if (s.d && s.d !== 'none') s.e.setAttribute('stroke-dasharray', s.d.split(' ').map(v => (v * sk).toFixed(3)).join(' '));
    }
  }
  for (const it of ITEMS) {
    const vis = it.prog > 0 && it.gone < 1;
    it.g.style.display = vis ? '' : 'none';
    const op = 1 - it.gone;
    it.g.setAttribute('opacity', op);
    it.hl.setAttribute('opacity', vis && it.fresh ? .55 * op : 0);
    if (!vis) { if (it.lab) it.lab.style.display = 'none'; if (it.sh) it.sh.style.display = 'none'; continue; }
    if (it.kind === 'marker') {
      const s = k * LS * Math.min(1, it.prog * 1.3);
      it.mark.setAttribute('transform', `translate(${f2(it.x)},${f2(it.y)}) scale(${s.toFixed(3)})`);
      it.hl.setAttribute('cx', it.x); it.hl.setAttribute('cy', it.y); it.hl.setAttribute('r', 16 * k * LS);
    } else {
      const part = partial(it.p, it.segs, it.len, it.prog);
      const d = smooth(part);
      for (const p of it.paths) p.setAttribute('d', d);
      it.hl.setAttribute('d', d);
      if (it.pencil) {
        const jp = part.map((q, i) => { const j = it.jit[Math.min(i, it.jit.length - 1)]; return [q[0] + j[0] * 1.4 * k, q[1] + j[1] * 1.4 * k]; });
        it.pencil.setAttribute('d', smooth(jp));
      }
    }
    const lo = Math.max(0, Math.min(1, (it.prog - .6) / .4)) * op;
    for (const [g, at] of [[it.lab, it.labAt], [it.sh, it.shAt]]) {
      if (!g) continue;
      g.style.display = lo > 0 ? '' : 'none';
      g.setAttribute('opacity', lo);
      g.setAttribute('transform', `translate(${f2(at[0])},${f2(at[1])}) scale(${(k * LS).toFixed(4)})`);
    }
  }
  for (const p of PL) p.g.setAttribute('transform', `translate(${f2(p.at[0])},${f2(p.at[1])}) scale(${(k * LS).toFixed(4)})`);
}

let cur = 0;
function setYear(y) { stamp.firstChild.nodeValue = y; stamp.style.fontSize = String(y).length > 4 ? '120px' : ''; }

}
function updateUI() {
  dots.forEach((d, i) => { d.classList.toggle('done', i <= cur); d.classList.toggle('cur', i === cur); });
  lis.forEach((li, i) => { li.classList.toggle('done', i <= cur); li.classList.toggle('cur', i === cur); });
  $('tfill').style.width = (EVENTS[cur].year - Y0) / (Y1 - Y0) * 100 + '%';
  const cnt = {bogazK: 0, bogazT: 0, halic: 0};
  for (const it of ITEMS) if (it.count && it.prog >= .99 && it.gone < .5) cnt[it.count]++;
  $('sBK').textContent = cnt.bogazK; $('sBT').textContent = cnt.bogazT; $('sHK').textContent = cnt.halic;
}

/* ---------------- Oynatma motoru ---------------- */
let playing = false, speed = 2, clock = 0, lastTs = null, gen = 0;
function frame(ts) {
  if (lastTs != null && playing) clock += Math.min(ts - lastTs, 100) * speed;
  lastTs = ts; render(); requestAnimationFrame(frame);
}
function wait(ms, step) {
  const g = gen, start = clock;
  return new Promise((res, rej) => {
    (function f() {
      if (g !== gen) return rej('cancel');
      const t = Math.min(1, (clock - start) / ms);
      if (step) step(t);
      t >= 1 ? res() : requestAnimationFrame(f);
    })();
  });
}
async function playEvent(i) {
  const ev = EVENTS[i], prev = EVENTS[cur];
  for (const it of ITEMS) it.fresh = false;
  showPanel(i);
  const from = view.slice(), to = ev.view, y0 = prev.year;
  const yr = t => setYear(Math.round(lerp(y0, ev.year, t)));
  if (!overlaps(from, to) && !(from[2] >= FULL[2]) && !(to[2] >= FULL[2])) {
    const via = unionV(from, to);
    await wait(600, t => { view = lerpV(from, via, ease(t)); yr(t / 2); });
    await wait(700, t => { view = lerpV(via, to, ease(t)); yr(.5 + t / 2); });
  } else {
    await wait(900, t => { view = lerpV(from, to, ease(t)); yr(t); });
  }
  setYear(ev.label || ev.year);
  const gone = (ev.removes || []).map(id => byId[id]);
  for (const it of ev.items) it.fresh = true;
  await wait(ev.items.length ? 1700 : 300, t => {
    const e = ease(t);
    ev.items.forEach(it => it.prog = e);
    gone.forEach(it => it.gone = e);
  });
  cur = i; updateUI();
  await wait(ev.full ? 4000 : 2300);
}
async function run() {
  const g = ++gen;
  try {
    while (cur < EVENTS.length - 1 && g === gen) await playEvent(cur + 1);
    if (g === gen) setPlaying(false);
  } catch (e) { /* iptal edildi */ }
}
function seek(i, keepPlaying = playing) {
  gen++;
  i = Math.max(0, Math.min(EVENTS.length - 1, i));
  cur = i;
  for (const it of ITEMS) {
    it.prog = it.ev <= i ? 1 : 0;
    it.fresh = it.ev === i && i > 0;
    it.gone = 0;
  }
  EVENTS.forEach((ev, j) => { if (j <= i) (ev.removes || []).forEach(id => byId[id].gone = 1); });
  view = EVENTS[i].view.slice();
  showPanel(i); setYear(EVENTS[i].label || EVENTS[i].year); updateUI();
  setPlaying(keepPlaying && i < EVENTS.length - 1);
}
function setPlaying(p) {
  const was = playing;
  playing = p;
  if (p && !was) {} // saat devam eder
  if (p && (gen === 0 || !running())) run();
}
let runGen = -1;
const running = () => runGen === gen;
const _run = run;
run = async function () { runGen = gen + 1; return _run(); };

const overlay = $('overlay');
function toggle() {
  overlay.style.display = 'none';
  if (!playing && cur >= EVENTS.length - 1) { seek(0, true); return; }
  setPlaying(!playing);
}
overlay.onclick = toggle;
$('stage').onclick = toggle;
document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.key === 'ArrowRight') seek(cur + 1, false);
  else if (e.key === 'ArrowLeft') seek(cur - 1, false);
  else if (e.key === 'r' || e.key === 'R') { overlay.style.display = 'none'; seek(0, false); setTimeout(() => setPlaying(true), 800); }
  else if (e.key === '1') speed = 1; else if (e.key === '2') speed = 1.5; else if (e.key === '3') speed = 2;
  else if (e.key === 'f' || e.key === 'F') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
});
function fitStage() {
  const s = Math.min(innerWidth / 1080, innerHeight / 1920);
  $('stage').style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener('resize', fitStage); fitStage();

// başlangıç
for (const it of EVENTS[0].items) it.prog = 1;
showPanel(0); setYear(1923); updateUI();
requestAnimationFrame(frame);
})();
</script>
